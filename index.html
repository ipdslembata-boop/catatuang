<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pencatatan Keuangan Terhubung GSheet</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #f8fafc; }
    </style>
</head>
<body class="p-4 sm:p-6 text-slate-800 max-w-2xl mx-auto">

    <!-- Header -->
    <div class="bg-white p-5 rounded-2xl shadow-sm border border-slate-200 mb-5 flex justify-between items-center">
        <div>
            <h1 class="text-lg font-bold text-slate-900">Keuangan Simpel</h1>
            <p class="text-xs text-slate-500 mt-0.5">Sinkron otomatis dengan Google Sheets.</p>
        </div>
        <button onclick="loadData()" id="btnRefresh" class="bg-slate-100 hover:bg-slate-200 text-slate-700 text-xs font-semibold px-3 py-2 rounded-xl transition cursor-pointer">
            🔄 Muat Ulang
        </button>
    </div>

    <!-- Ringkasan Saldo (Sumber dari Sheet Dashboard) -->
    <div class="grid grid-cols-3 gap-3 mb-5">
        <div class="bg-emerald-50 border border-emerald-200 p-4 rounded-2xl">
            <p class="text-[10px] font-semibold text-emerald-600 uppercase">Pemasukan</p>
            <h2 id="totalPemasukan" class="text-sm sm:text-base font-bold text-emerald-700 mt-1">Rp 0</h2>
        </div>
        <div class="bg-rose-50 border border-rose-200 p-4 rounded-2xl">
            <p class="text-[10px] font-semibold text-rose-600 uppercase">Pengeluaran</p>
            <h2 id="totalPengeluaran" class="text-sm sm:text-base font-bold text-rose-700 mt-1">Rp 0</h2>
        </div>
        <div class="bg-blue-50 border border-blue-200 p-4 rounded-2xl">
            <p class="text-[10px] font-semibold text-blue-600 uppercase">Sisa Saldo</p>
            <h2 id="totalSaldo" class="text-sm sm:text-base font-bold text-blue-700 mt-1">Rp 0</h2>
        </div>
    </div>

    <!-- Form Input -->
    <div class="bg-white p-5 rounded-2xl shadow-sm border border-slate-200 mb-5">
        <h2 class="text-xs font-bold text-slate-900 mb-3">Tambah Transaksi Baru</h2>
        <form id="transaksiForm" onsubmit="tambahTransaksi(event)" class="space-y-3">
            <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
                <div>
                    <label class="block text-[11px] font-semibold text-slate-600 mb-1">Tanggal</label>
                    <input type="date" id="inputTanggal" required class="w-full text-xs bg-slate-50 border border-slate-300 rounded-xl p-2.5 outline-none focus:border-blue-500">
                </div>
                <div>
                    <label class="block text-[11px] font-semibold text-slate-600 mb-1">Jenis Transaksi</label>
                    <select id="inputJenis" class="w-full text-xs bg-slate-50 border border-slate-300 rounded-xl p-2.5 outline-none focus:border-blue-500 font-medium">
                        <option value="Pendapatan">🟢 Pendapatan</option>
                        <option value="Pengeluaran">🔴 Pengeluaran</option>
                    </select>
                </div>
            </div>
            <div>
                <label class="block text-[11px] font-semibold text-slate-600 mb-1">Keterangan</label>
                <input type="text" id="inputKeterangan" placeholder="Contoh: Gaji / Beli Makan" required class="w-full text-xs bg-slate-50 border border-slate-300 rounded-xl p-2.5 outline-none focus:border-blue-500">
            </div>
            <div>
                <label class="block text-[11px] font-semibold text-slate-600 mb-1">Jumlah (Rp)</label>
                <input type="text" id="inputJumlah" placeholder="50.000" oninput="formatRupiahInput(this)" required class="w-full text-xs bg-slate-50 border border-slate-300 rounded-xl p-2.5 outline-none focus:border-blue-500 font-semibold text-slate-800">
            </div>
            <button type="submit" id="btnSimpan" class="w-full bg-blue-600 hover:bg-blue-700 text-white text-xs font-semibold p-3 rounded-xl transition cursor-pointer shadow-sm">
                ➕ Simpan ke GSheet
            </button>
        </form>
    </div>

    <!-- Riwayat Transaksi -->
    <div class="bg-white rounded-2xl shadow-sm border border-slate-200 overflow-hidden">
        <div class="p-4 border-b border-slate-100 flex justify-between items-center">
            <h2 class="text-xs font-bold text-slate-900">Riwayat Transaksi (Dari Google Sheets)</h2>
            <span id="statusLoad" class="text-[10px] text-slate-400">Memuat data...</span>
        </div>
        <div class="overflow-x-auto">
            <table class="w-full text-left border-collapse text-xs">
                <thead>
                    <tr class="bg-slate-50 text-slate-500 border-b border-slate-200">
                        <th class="p-3 font-semibold">Tanggal</th>
                        <th class="p-3 font-semibold">Keterangan</th>
                        <th class="p-3 font-semibold">Jenis</th>
                        <th class="p-3 font-semibold text-right">Jumlah</th>
                    </tr>
                </thead>
                <tbody id="tabelTransaksi" class="divide-y divide-slate-100">
                    <tr><td colspan="4" class="p-5 text-center text-slate-400">Menghubungkan ke Google Sheets...</td></tr>
                </tbody>
            </table>
        </div>
    </div>

    <script>
        const WEB_APP_URL = "https://script.google.com/macros/s/AKfycbxxJ6DW1jegCtCUnEKo0Zyc-SUcTbHabSFzNBpaS2pyqPJnMkfLLCrPPcY6qR2li4an/exec";

        document.getElementById('inputTanggal').valueAsDate = new Date();

        function formatRupiahInput(el) {
            let value = el.value.replace(/[^,\d]/g, '').toString();
            let split = value.split(',');
            let sisa = split[0].length % 3;
            let rupiah = split[0].substr(0, sisa);
            let ribuan = split[0].substr(sisa).match(/\d{3}/gi);

            if (ribuan) {
                let separator = sisa ? '.' : '';
                rupiah += separator + ribuan.join('.');
            }

            rupiah = split[1] !== undefined ? rupiah + ',' + split[1] : rupiah;
            el.value = rupiah;
        }

        async function loadData() {
            const statusLoad = document.getElementById('statusLoad');
            statusLoad.innerText = '⏳ Menyinkronkan...';
            
            try {
                const response = await fetch(WEB_APP_URL);
                const result = await response.json();
                
                // Update Kotak Saldo dari sheet Dashboard
                if (result.summary) {
                    const pem = Number(result.summary.pemasukan) || 0;
                    const peng = Number(result.summary.pengeluaran) || 0;
                    const saldo = Number(result.summary.sisaSaldo) || 0;

                    document.getElementById('totalPemasukan').innerText = 'Rp ' + pem.toLocaleString('id-ID');
                    document.getElementById('totalPengeluaran').innerText = 'Rp ' + peng.toLocaleString('id-ID');
                    document.getElementById('totalSaldo').innerText = 'Rp ' + saldo.toLocaleString('id-ID');
                }

                // Update Tabel Riwayat dari sheet keuangan
                renderTabel(result.history || []);
                statusLoad.innerText = '✅ Sinkron';
            } catch (error) {
                console.error(error);
                statusLoad.innerText = '❌ Gagal memuat';
                document.getElementById('tabelTransaksi').innerHTML = `<tr><td colspan="4" class="p-5 text-center text-red-400">Gagal memuat data dari Google Sheets.</td></tr>`;
            }
        }

        function renderTabel(transaksis) {
            const tbody = document.getElementById('tabelTransaksi');
            tbody.innerHTML = '';

            if (!Array.isArray(transaksis) || transaksis.length === 0) {
                tbody.innerHTML = `<tr><td colspan="4" class="p-5 text-center text-slate-400">Belum ada transaksi tercatat di Google Sheets.</td></tr>`;
                return;
            }

            transaksis.slice().reverse().forEach(item => {
                const jml = Number(item.jumlah) || 0;
                const badgeColor = item.jenis === 'Pendapatan' ? 'bg-emerald-50 text-emerald-700' : 'bg-rose-50 text-rose-700';

                let tglFormatted = item.tanggal;
                if(item.tanggal && item.tanggal.length > 10) {
                    tglFormatted = item.tanggal.substring(0, 10);
                }

                tbody.innerHTML += `
                    <tr class="hover:bg-slate-50">
                        <td class="p-3 text-slate-500">${tglFormatted || '-'}</td>
                        <td class="p-3 font-medium text-slate-800">${item.keterangan || '-'}</td>
                        <td class="p-3"><span class="px-2 py-0.5 rounded-md text-[10px] font-semibold ${badgeColor}">${item.jenis || 'Pengeluaran'}</span></td>
                        <td class="p-3 text-right font-semibold ${item.jenis === 'Pendapatan' ? 'text-emerald-600' : 'text-rose-600'}">
                            ${item.jenis === 'Pendapatan' ? '+' : '-'} Rp ${jml.toLocaleString('id-ID')}
                        </td>
                    </tr>
                `;
            });
        }

        async function tambahTransaksi(e) {
            e.preventDefault();
            const tanggal = document.getElementById('inputTanggal').value;
            const jenis = document.getElementById('inputJenis').value;
            const keterangan = document.getElementById('inputKeterangan').value;
            
            const rawJumlah = document.getElementById('inputJumlah').value;
            const jumlah = rawJumlah.replace(/\./g, '');

            const btn = document.getElementById('btnSimpan');
            btn.innerText = '⏳ Mengirim ke GSheet...';
            btn.disabled = true;

            const dataBaru = { tanggal, jenis, keterangan, jumlah };

            try {
                await fetch(WEB_APP_URL, {
                    method: 'POST',
                    mode: 'no-cors',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(dataBaru)
                });

                document.getElementById('transaksiForm').reset();
                document.getElementById('inputTanggal').valueAsDate = new Date();
                
                // Beri jeda 1 detik agar rumus di Sheets sempat kalkulasi, lalu muat ulang
                setTimeout(() => {
                    loadData();
                }, 1000);

                alert('Berhasil! Data tersimpan ke Google Sheets.');
            } catch (error) {
                console.error(error);
                alert('Gagal terhubung ke server Google Sheets.');
            } finally {
                btn.innerText = '➕ Simpan ke GSheet';
                btn.disabled = false;
            }
        }

        loadData();
    </script>
</body>
</html>
